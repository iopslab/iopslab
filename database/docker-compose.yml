version: '3'
services:
  mongo-service:
    image: mongo
    container_name: mongo-server
    ports:
      - "27017:27017"
    volumes:
      - "./data/mongo/db:/data/db"  # make data persistent 持久化
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "kelvinfung"
      MONGO_INITDB_ROOT_PASSWORD: "kelvinfung666"
  seaweedfs-service:
    image: chrislusf/seaweedfs # use a remote image
    container_name: seaweedfs-server
    restart: always
    #    command: "server -dir /data -master.dir /data -volume.dir.idx /data -ip localhost -ip.bind 0.0.0.0 -filer -encryptVolumeData"
    command: "server -dir /data -master.dir /data -volume.dir.idx /data -ip localhost -ip.bind 0.0.0.0 -filer"
    ports:
      - "8888:8888"
    volumes:
      - "./data/seaweedfs/:/data"
